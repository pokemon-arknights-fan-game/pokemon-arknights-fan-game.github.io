<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="포켓몬과 명일방주를 결합한 비공식 팬게임. 로비에서 전투 훈련을 시작하세요.">
  <title>Pokémon × 명일방주 | 로비</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <link id="lobby-styles" rel="stylesheet" href="./src/styles/lobby.css">
  <link id="battle-styles" rel="stylesheet" href="./src/styles/prototype.css" disabled>
  <link id="deck-styles" rel="stylesheet" href="./src/styles/decks.css" disabled>
  <link rel="stylesheet" href="./src/styles/shell.css">
  <script src="./src/scripts/local-server-notice.js" defer></script>
  <script src="./src/scripts/shell.js" type="module"></script>
</head>
<body>
  <header class="shell-toolbar" aria-label="공통 화면 설정">
    <span id="screen-label">로비</span>
    <span id="fullscreen-status" role="status" aria-live="polite"></span>
    <button id="fullscreen-button" type="button" aria-pressed="false">전체 화면</button>
  </header>
  <div id="game-screen">
<p id="screen-loading" class="screen-reader-only" role="status">화면 전환 중</p>

</div>
  <p id="local-server-notice" hidden>로컬 서버가 필요합니다. 프로젝트 폴더에서 <code>python -m http.server 8000 --bind 127.0.0.1</code>을 실행한 뒤 http://localhost:8000 을 열어 주세요.</p>
  <div id="screen-transition" class="screen-transition" hidden role="status" aria-label="화면 전환 중">
    <div class="transition-art" aria-hidden="true"><span class="transition-ring"></span><span class="transition-mark">✦</span></div>
    <span class="transition-caption" aria-hidden="true">POKÉMON × ARKNIGHTS</span>
  </div>
  <noscript>화면 연결에는 JavaScript가 필요합니다. 브라우저에서 JavaScript를 허용해 주세요.</noscript>
</body>
</html>
